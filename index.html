<style>
:root{--bg:#f3f5f2;--bg2:#e8ece7;--card:#ffffff;--ink:#0d1512;--mut:#5d6964;--line:#dbe2dd;--acc:#0f766e;--acc2:#14b8a6;--gold:#d4a017;
--ok:#047857;--okbg:#d1fae5;--bad:#dc2626;--badbg:#fee2e2;--part:#b45309;--partbg:#fef3c7;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(15,60,50,.08);
--hero:linear-gradient(135deg,#0b3d36 0%,#0f766e 55%,#14b8a6 100%);--input:#f6f8f6}
@media (prefers-color-scheme:dark){:root{--bg:#070b0a;--bg2:#0d1412;--card:#111a17;--ink:#ecf3ef;--mut:#8fa29a;--line:#1f2b27;--acc:#2dd4bf;--acc2:#5eead4;--gold:#facc15;
--ok:#34d399;--okbg:#06281c;--bad:#f87171;--badbg:#2c0b0b;--part:#fbbf24;--partbg:#2a1d05;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.45);
--hero:linear-gradient(135deg,#042f2a 0%,#0b5e56 55%,#0f9488 100%);--input:#0b1310}}
@font-face{font-family:"InterApp";src:url("inter.woff2") format("woff2");font-weight:100 900;font-display:block}
*{box-sizing:border-box}
button,input,textarea,select{font-family:inherit}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg));min-height:100vh;color:var(--ink);font:16px/1.4 "InterApp",system-ui,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.2px;font-weight:800}
header h1 small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:1.2px;text-transform:uppercase}
header button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}
main{max-width:640px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;font-weight:800}
.hero{background:var(--hero);color:#fff;border:0;border-radius:24px;padding:20px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:30px;line-height:1}
.ring .n small{font-size:12px;font-weight:600;opacity:.8;margin-top:4px}
.hero h3{margin:0 0 4px;font-size:21px;font-weight:900;letter-spacing:-.2px}
.hero p{margin:0;opacity:.88;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);text-align:center}
.chip b{display:block;font-size:17px;font-weight:900}
.chip span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.chip.ok b{color:var(--ok)}.chip.bad{border-color:var(--bad);background:var(--badbg)}.chip.bad b{color:var(--bad)}
.alarm{border:2px solid var(--bad);background:var(--badbg);color:var(--bad);border-radius:20px;padding:14px 16px;margin-bottom:14px;animation:pulse 1.6s ease-in-out infinite;box-shadow:0 0 0 0 rgba(220,38,38,.5)}
.alarm h4{margin:0 0 6px;font-size:18px;font-weight:900;display:flex;gap:8px;align-items:center}
.alarm ul{margin:0;padding-left:20px;font-weight:700;font-size:15px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.passbar{border:2px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:20px;padding:14px 16px;margin-bottom:14px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;border:1px solid var(--line);border-radius:18px;padding:16px 4px 12px;text-align:center;font-weight:900;font-size:21px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile small{display:block;font-weight:600;font-size:12px;color:var(--mut);margin-top:3px}
.tile.ok{border:2px solid var(--ok);background:linear-gradient(180deg,var(--okbg),var(--card))}
.tile.ok:after{content:"✓";position:absolute;top:6px;right:9px;font-size:14px;color:var(--ok)}
.tile.bad{border:2px solid var(--bad);background:var(--badbg);animation:pulse 1.6s ease-in-out infinite}
.tile.bad:after{content:"!";position:absolute;top:5px;right:10px;font-size:15px;color:var(--bad)}
.tile.part{border:2px solid var(--part);background:linear-gradient(180deg,var(--partbg),var(--card))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--mut);font-size:14px}
.pill{font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap;font-size:14px}
.pill.ok{color:var(--ok);background:var(--okbg)}.pill.warn{color:var(--part);background:var(--partbg)}.pill.bad{color:#fff;background:var(--bad)}.pill.wait{color:var(--mut);background:var(--bg2)}
.obs{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.obs label{font-size:14px;color:var(--mut)}.obs label b{font-size:16px;color:var(--ink);display:inline-block;min-width:26px}
.obs.badobs label b{color:var(--bad)}
.dms{display:flex;align-items:center;gap:3px}
.dms input{width:50px;font-size:21px;font-weight:700;padding:9px 2px;text-align:center;border:1.5px solid var(--line);border-radius:12px;background:var(--input);color:var(--ink);font-variant-numeric:tabular-nums}
.dms input.d{width:62px}
.dms i{font-style:normal;color:var(--mut);font-size:15px;font-weight:700}
input.err{border-color:var(--bad)!important;background:var(--badbg)!important;color:var(--bad)!important}
input:focus{outline:none;border-color:var(--acc)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.dist{display:grid;grid-template-columns:1fr 140px;align-items:center;gap:8px;padding:8px 0}
.dist label{font-size:14px}
.dist input{font-size:21px;font-weight:700;padding:9px 10px;border:1.5px solid var(--line);border-radius:12px;width:100%;background:var(--input);color:var(--ink);text-align:right}
.big{font-size:26px;font-weight:900;letter-spacing:-.3px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1 1 45%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:800;box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--hero);color:#fff;border:0}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}
textarea{width:100%;min-height:60px;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--input);color:var(--ink)}
.nav{display:flex;gap:10px;margin-bottom:14px}.nav .btn{flex:1}
.sth{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sth .from,.sth .to{flex:1;text-align:center;background:var(--bg2);border-radius:14px;padding:10px 4px}
.sth .from b,.sth .to b{display:block;font-size:20px;font-weight:900}
.sth .from span,.sth .to span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.sth .me{font-size:28px;font-weight:900;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;font-weight:700}
tr.badrow td{background:var(--badbg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ok);color:#fff;font-weight:900;padding:14px 22px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:50;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--bad)}
.hidden{display:none}
.bookwrap{overflow-x:auto;margin:6px -16px 10px;padding:0 16px}.book{border-collapse:collapse;font-size:13px;white-space:nowrap}.book th,.book td{border:1px solid var(--line);padding:5px 6px;text-align:right}.book th{font-size:10px;text-align:center;background:var(--bg2)}.book td:first-child{position:sticky;left:0;background:var(--card);text-align:left;font-weight:800}.book tr.named td{background:var(--okbg)}.book tr.sum td{font-weight:900;background:var(--bg2)}.bookh{font-weight:900;margin:12px 0 4px}.lsticky{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}.lsticky span{flex:1;font-size:14px;color:var(--mut)}.lsticky b{color:var(--ink);font-size:17px}.lsticky .btn{flex:none;padding:12px 18px}details.card summary{cursor:pointer;list-style:none}details.card summary::-webkit-details-marker{display:none}.bookhd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.bookhd label{font-size:12px;color:var(--mut);font-weight:700}.bookhd input{display:block;width:100%;margin-top:2px;font:inherit;font-size:15px;font-weight:700;padding:7px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink)}
.accs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.acc{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:4px;color:var(--ink);font-size:12px;font-weight:700}.acc i{width:40px;height:40px;border-radius:50%;box-shadow:var(--shadow);border:3px solid transparent}.acc.on i{outline:2.5px solid var(--ink);outline-offset:3px}
.hubhead{margin:4px 4px 14px}.hubhead p.mkby{font-size:14px;margin-top:6px;color:var(--acc);font-weight:700}.hubhead p.mkby .cl{width:20px;height:13px;vertical-align:-1px;margin:0 4px 0 2px}.hubhead p.mkby .em{width:15px;height:15px;vertical-align:-3px;margin-right:5px}.hubhead p.mkby a{color:inherit;font-weight:600;font-size:13px;text-decoration:none}.hubhead h3{margin:0;font-size:24px;font-weight:900;letter-spacing:-.3px}.hubhead p{margin:4px 0 0;color:var(--mut);font-size:14px}
.wcard{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;margin-bottom:12px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);transition:transform .12s}
.wcard:active{transform:scale(.98)}
.wic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.wtx{flex:1;min-width:0}.wtx b{display:block;font-size:18px;font-weight:900}.wtx small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.wgo{font-size:30px;color:var(--mut);font-weight:300}
.bar{height:6px;border-radius:99px;background:var(--bg2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#facc15,var(--acc2));border-radius:99px}
.wcard.bad{border:2px solid var(--bad);background:var(--badbg)}.wcard.ok{border:2px solid var(--ok)}
.wcard.soon{opacity:.5;box-shadow:none}.wcard.soon .wic{background:var(--bg2);color:var(--mut)}
.tmb{display:flex;gap:4px}.tmb input{width:72px;font-size:19px;font-weight:700;padding:9px 2px;text-align:center;border:1.5px solid var(--line);border-radius:12px;background:var(--input);color:var(--ink)}
input.pt{width:84px;font:inherit;font-weight:800;font-size:15px;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);text-transform:uppercase}
.lcard{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.lcard b{font-size:17px;font-weight:900;display:block}.lcard small{color:var(--mut);font-size:13px}.lcard.bad{border:2px solid var(--bad);background:var(--badbg)}
.cfgin{width:150px;font:inherit;font-weight:700;font-size:16px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);text-align:right}
.step{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:800}.step b{min-width:28px;text-align:center;font-size:20px}
body.sysfont{font-family:system-ui,Roboto,"Segoe UI",sans-serif}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:10px;border-radius:10px;font-weight:800;font-size:15px}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.gstep{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.gstep:last-child{border-bottom:0}
.gn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.gstep b{font-weight:800}.glist{margin:0;padding-left:20px;font-size:15px}.glist li{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px}.chips small{opacity:.7;margin-right:2px}.chips button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line,#ccc);background:var(--card,#fff);color:inherit}
#app .pill.bad{color:#fff}.nez{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0}.nez label{font-size:12px;color:var(--mut);font-weight:800}.nez input{display:block;width:100%;margin-top:2px;font:inherit;font-size:14px;font-weight:700;padding:9px 4px;letter-spacing:-.2px;border:1.5px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);text-align:right;min-width:0}

/* ===== print book (print.js) ===== */

.pb{color:#0b1f4d;font-family:"Times New Roman",Times,"Noto Serif","Liberation Serif",serif}

.pb .pnote{font-size:11pt;text-align:center;margin:3mm 0 0;color:#0b1f4d}
.pb .psub{font-weight:bold;font-size:12pt;text-align:center;margin:4mm 0 1.5mm}
.pb .pdraw svg{width:100%;height:118mm;display:block}
.pb .pfoot{display:flex;justify-content:space-between;font-size:9.5pt;margin-top:3mm}
.pb .cover h1{text-align:center;font-size:26pt;margin:12mm 0 2mm}.pb .csub{text-align:center;font-size:15pt;margin:0 0 7mm}.pb .ctoc{min-width:150mm}.pb .credit{text-align:center;font-size:10pt;margin-top:8mm;font-style:italic}

.pbin .psub{text-align:left;font-size:13px;margin:8px 0 4px}.pbin .pdraw svg{width:640px;height:auto}.pbin .gales{font-size:11px}

<body>
<header><h1 id="title">Major Traverse</h1><button id="guideBtn">Guide</button><button id="homeBtn" class="hidden">◀ All</button></header>
<main id="app"></main>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">
<script>
// If anything fails to start, show it instead of a black screen, with a repair button (readings are kept).
window.addEventListener("error",function(ev){try{var a=document.getElementById("app");if(!a||a.childElementCount)return;
 a.innerHTML='<div style="padding:16px;margin:16px;border:2px solid #dc2626;border-radius:16px;background:#fee2e2;color:#7f1d1d;font:16px system-ui"><b>The app failed to start.</b><br><small>'+String(ev.message).replace(/</g,"&lt;")+'</small><br><br>Your readings are safe. Tap Repair to reload a fresh copy of the app.<br><br><button id="rep" style="padding:12px 18px;border-radius:10px;border:0;background:#0f766e;color:#fff;font-weight:800;font-size:16px">Repair app</button></div>';
 document.getElementById("rep").onclick=async function(){try{if(navigator.serviceWorker){var r=await navigator.serviceWorker.getRegistrations();for(var x of r)await x.unregister()}if(window.caches){var k=await caches.keys();for(var c of k)await caches.delete(c)}}catch(e){}location.reload()}}catch(e){}});
</script>

<script>
"use strict";
/* ===== Traverse profiles: major (closed loop, 2 sets) and minor (link or loop, 1 set) ===== */
const PROFILES={
  major:{name:"Major Traverse",home:"trav",pre:"",dataKey:"trav-major-v1",cfgKey:"trav-config-v1",sets:2,
    def:{group:"07",type:"loop",cps:["CP1","CP2"],m:16,px:"M",a:"",b:"",c:"",d:"",brgS:"",brgE:""},lim:{face:20,sets:60,prec:5000,ratio:2,angK:30}},
  minor:{name:"Minor Traverse",home:"minor",pre:"minor/",dataKey:"trav-minor-v1",cfgKey:"trav-minor-config-v1",sets:1,
    def:{group:"",type:"link",cps:[],m:6,px:"m",a:"",b:"",c:"",d:"",brgS:"",brgE:""},lim:{face:20,sets:60,prec:3000,ratio:3,angK:60}}};
const TS_KEY="trav-major-v1-t";
const OBS = [["bsL","FL","BS"],["fsL","FL","FS"],["bsR","FR","BS"],["fsR","FR","FS"]]; // template row order
const OBS_FIELD = [["bsL","FL","BS"],["fsL","FL","FS"],["fsR","FR","FS"],["bsR","FR","BS"]]; // field work order: FL BS→FS, change face, FR FS→BS
let PK=null,PROF,CFG,CFG_KEY,KEY,LIM,SETS,ST=[],N=0,D={},LINK=false,AREF="",DREF="";
function loadCfg(k){const P=PROFILES[k];let c=null;try{c=JSON.parse(localStorage.getItem(P.cfgKey))}catch(e){}return{cfg:Object.assign({},P.def,c||{}),configured:!!c}}
const blankSt=()=>({sets:[{},{}],dBS:"",dFS:"",note:""});
function useTrav(k,force){if(PK===k&&!force)return;PK=k;PROF=PROFILES[k];const r=loadCfg(k);CFG=r.cfg;PROF.configured=r.configured||k==="major";
  CFG_KEY=PROF.cfgKey;KEY=PROF.dataKey;LIM=PROF.lim;SETS=PROF.sets;
  const mN=Array.from({length:CFG.m},(_,i)=>CFG.px+(i+1));
  PROF.ready=CFG.type!=="link"||!!(CFG.a&&CFG.b&&CFG.c&&CFG.d);
  LINK=CFG.type==="link"&&PROF.ready;AREF=CFG.a;DREF=CFG.d;
  ST=LINK?[CFG.b].concat(mN,[CFG.c]):(CFG.type==="link"?mN:CFG.cps.concat(mN));N=ST.length;
  try{D=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){D={}}
  for(const s of ST)if(!D[s])D[s]=blankSt()}
function blank(){const o={};for(const s of ST)o[s]=blankSt();return o}
const bsOf=i=>LINK?(i===0?AREF:ST[i-1]):ST[(i-1+N)%N], fsOf=i=>LINK?(i===N-1?DREF:ST[i+1]):ST[(i+1)%N];
let saveErr=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem(TS_KEY,new Date().toISOString());saveErr=false}catch(e){saveErr=true;alert("Could not save on this phone! Make a backup now.")}}
useTrav("major");
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ===== Maths (same as template HCR sheet) ===== */
const dec = a => (a&&a.length===3&&a.every(v=>v!==""&&v!=null))?(+a[0])+(+a[1])/60+(+a[2])/3600:null;
const mod360 = x => ((x%360)+360)%360;
function fmt(x){ // template's LET formula: round to whole seconds, carry 60
  if(x==null||isNaN(x))return "–";const neg=x<0;x=Math.abs(x);
  let d=Math.floor(x),mr=(x-d)*60,m=Math.floor(mr),s=Math.round((mr-m)*60);
  if(s===60){s=0;m++}if(m===60){m=0;d++}
  return (neg?"-":"")+d+"° "+m+"' "+s+'"';
}
const secs = x => Math.round(x*3600);
function setCalc(set){
  const r={};for(const[k]of OBS)r[k]=dec(set[k]);
  r.FL=(r.bsL!=null&&r.fsL!=null)?mod360(r.fsL-r.bsL):null;
  r.FR=(r.bsR!=null&&r.fsR!=null)?mod360(r.fsR-r.bsR):null;
  r.mean=(r.FL!=null&&r.FR!=null)?(r.FL+r.FR)/2:null;
  // FL angle vs FR angle (seconds), same ±20" limit
  r.dA=(r.FL!=null&&r.FR!=null)?(((secs(r.FL)-secs(r.FR))%1296000+1944000)%1296000)-648000:null;
  // guideline check: FR reading - FL reading on same target = 180° ± 20"
  r.cBS=(r.bsL!=null&&r.bsR!=null)?secs(mod360(r.bsR-r.bsL))-648000:null;
  r.cFS=(r.fsL!=null&&r.fsR!=null)?secs(mod360(r.fsR-r.fsL))-648000:null;
  return r;
}
function stCalc(s){
  const st=D[s],a=setCalc(st.sets[0]),b=setCalc(st.sets[1]);
  const final=SETS===1?a.mean:(a.mean!=null&&b.mean!=null)?(a.mean+b.mean)/2:null;
  const setDiff=SETS===2&&final!=null?Math.abs(secs(a.mean)-secs(b.mean)):null;
  const faceVals=SETS===1?[a.cBS,a.cFS]:[a.cBS,a.cFS,b.cBS,b.cFS];
  const faceBad=faceVals.some(v=>v!=null&&Math.abs(v)>LIM.face);
  const setBad=setDiff!=null&&setDiff>LIM.sets;
  const filled=OBS.every(([k])=>dec(st.sets[0][k])!=null&&(SETS===1||dec(st.sets[1][k])!=null));
  const any=OBS.some(([k])=>st.sets[0][k]||st.sets[1][k])||st.dBS||st.dFS;
  const ix=ST.indexOf(s),dOk=(num(st.dBS)!=null||(LINK&&ix===0))&&(num(st.dFS)!=null||(LINK&&ix===N-1));
  const status=(faceBad||setBad)?"bad":(filled&&dOk)?"ok":any?"part":"";
  return{a,b,final,setDiff,faceBad,setBad,status};
}
function dmsTxt(t){const m=String(t||"").trim().split(/[^\d.]+/).filter(Boolean).map(Number);if(!m.length||m.some(isNaN))return null;return (m[0]||0)+(m[1]||0)/60+(m[2]||0)/3600}
const legBefore=(L,i)=>LINK?(i>0?L[i-1]:null):L[(i-1+N)%N],legAfter=(L,i)=>LINK?(i<N-1?L[i]:null):L[i];
const num = v => (v===""||v==null||isNaN(+v))?null:+v;
function legs(){ // leg i: ST[i] -> ST[i+1]; FW measured at ST[i] (its FS), BW at ST[i+1] (its BS)
  return (LINK?ST.slice(0,-1):ST).map((s,i)=>{
    const t=fsOf(i),fw=num(D[s].dFS),bw=num(D[t].dBS);
    const both=fw!=null&&bw!=null,avg=both?(fw+bw)/2:(fw??bw);
    const disc=both?Math.abs(fw-bw):null;
    const prec=both?(disc===0?Infinity:avg/disc):null;
    return{from:s,to:t,fw,bw,avg,disc,prec};
  });
}
// leg ratio is judged to one decimal like the norm "2 : 1" (2.01 : 1 passes, 2.05 : 1 does not)
const ratioOver=S=>S.ratio!=null&&Math.round(S.ratio*10)/10>LIM.ratio;
function summary(){
  const L=legs(),known=L.filter(l=>l.avg!=null);
  let ratio=null,maxL=null,minL=null;
  if(known.length>=2){maxL=known.reduce((p,c)=>c.avg>p.avg?c:p);minL=known.reduce((p,c)=>c.avg<p.avg?c:p);ratio=maxL.avg/minL.avg}
  const C=ST.map(stCalc),done=C.filter(c=>c.final!=null);
  const sum=done.reduce((p,c)=>p+c.final,0);
  const perm=LIM.angK*Math.sqrt(N);let theo=null,err=null,brgCalc=null;
  if(!LINK){theo=(2*N-4)*90;if(done.length===N)err=secs(sum)-theo*3600}
  else{const bS=dmsTxt(CFG.brgS),bE=dmsTxt(CFG.brgE);
    if(bS!=null&&done.length===N){brgCalc=mod360(bS+sum+N*180);if(bE!=null){let x=brgCalc-bE;x=((x+180)%360+360)%360-180;err=secs(x)}}}
  const perim=known.reduce((p,c)=>p+c.avg,0);
  return{L,known,ratio,maxL,minL,C,done,sum,theo,perm,err,perim,brgCalc};
}

/* ===== UI ===== */
const app=document.getElementById("app"),title=document.getElementById("title"),homeBtn=document.getElementById("homeBtn"),guideBtn=document.getElementById("guideBtn");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=(state,txt)=>`<span class="pill ${state}">${txt}</span>`;
function precTxt(p){return p===Infinity?"1/∞":"1/"+Math.round(p)}
let cur=null,lastStatus=null;
let backTo="",guideTo="guide";homeBtn.onclick=()=>{location.hash=backTo};guideBtn.onclick=()=>{location.hash=guideTo};
window.addEventListener("hashchange",route);
function route(){const h=decodeURIComponent(location.hash.slice(1));lastStatus=null;backTo="";homeBtn.textContent="◀ All";guideBtn.classList.remove("hidden");
  for(const lk of["lev","fly","mlev","bfly","bloop"])if(h===lk||h.startsWith(lk+"/")){useLev(lk);guideTo=lk+"/guide";renderLev(h);window.scrollTo(0,0);return}
  if(h==="ct"){location.hash=typeof ctJob!=="undefined"&&ctJob?"br/"+ctJob:"";return} // general coordinate transfer menu removed; setups live under the bridge jobs
  if(h.startsWith("ct/")){renderCT(h);window.scrollTo(0,0);return}
  if(h==="br"||h.startsWith("br/")){renderBR(h);window.scrollTo(0,0);return}
  if(h==="print"||h.startsWith("print/")){renderPrint(h);window.scrollTo(0,0);return}
  if(h===""){renderHub();window.scrollTo(0,0);return}
  let k="major",rest=h;if(h==="minor"||h.startsWith("minor/")){k="minor";rest=h==="minor"?"":h.slice(6)}else if(h==="trav")rest="";
  useTrav(k);cur=ST.includes(rest)?rest:null;guideTo=PROF.pre+"guide";
  backTo=rest===""?"":PROF.home;homeBtn.textContent=rest===""?"◀ Home":"◀ All";
  cur?renderStation(cur):rest==="guide"?renderGuide():renderHome();window.scrollTo(0,0)}
function toast(msg,bad){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}
  t.textContent=msg;t.classList.toggle("bad",!!bad);requestAnimationFrame(()=>t.classList.add("show"));clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);
  if(navigator.vibrate)navigator.vibrate(bad?[200,80,200,80,200]:[60,40,60])}
function issues(s){ // every failing check at a station, worded for the field
  const i=ST.indexOf(s),c=stCalc(s),out=[];
  [c.a,c.b].slice(0,SETS).forEach((r,si)=>{const set=SETS===1?"Angle":"Set "+(si?"II":"I");
    if(r.cBS!=null&&Math.abs(r.cBS)>LIM.face)out.push(`${set}: FR−FL on ${bsOf(i)} off by ${Math.abs(r.cBS)}″ (limit 20″)`);
    if(r.cFS!=null&&Math.abs(r.cFS)>LIM.face)out.push(`${set}: FR−FL on ${fsOf(i)} off by ${Math.abs(r.cFS)}″ (limit 20″)`);});
  if(c.setBad)out.push(`Set I vs Set II differ by ${c.setDiff}″ (limit 60″)`);
  const L=legs();for(const l of[legBefore(L,i),legAfter(L,i)])if(l&&l.prec!=null&&l.prec<LIM.prec)out.push(`Leg ${l.from}–${l.to} precision ${precTxt(l.prec)} (need 1/${LIM.prec})`);
  const st=D[s];for(const si of(SETS===1?[0]:[0,1]))for(const[k,f,t]of OBS){const v=st.sets[si][k];if(v&&v.some((x,p)=>!cellOK(p,x||"")))out.push(`Set ${si?"II":"I"} ${f}→${t}: value out of range`)}
  return out;
}
function ring(done){const r=50,C=2*Math.PI*r,f=done/N;
  return `<div class="ring"><svg width="112" height="112"><circle cx="56" cy="56" r="${r}" stroke="rgba(255,255,255,.18)" stroke-width="10" fill="none"/>
  <circle cx="56" cy="56" r="${r}" stroke="url(#g)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" style="transition:stroke-dashoffset .8s"/>
  <defs><linearGradient id="g"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#facc15"/></linearGradient></defs></svg>
  <div class="n">${done}<small>of ${N}</small></div></div>`}
function motto(S){const d=S.done.length,left=N-d;
  if(S.err!=null)return Math.abs(S.err)<=S.perm?["Traverse closed","Error "+S.err+"″ within ±"+Math.round(S.perm)+"″. Brilliant work."]:["All observed","Closing error "+S.err+"″ exceeds ±"+Math.round(S.perm)+"″. Find the bad station."];
  if(d===0)return["Let's go"+(CFG.group?", Group "+esc(CFG.group):""),N+" stations to conquer today."];
  if(d<N/2)return[d+" down, "+left+" to go","Steady pace beats rushing."];
  if(left>3)return["Past halfway","Only "+left+" stations left."];
  return["Final stretch",left+" more and the "+(LINK?"traverse":"loop")+" closes."]}

function renderGuide(){
  title.innerHTML=`How to observe<small>Total station · ${PROF.name.toLowerCase()}</small>`;homeBtn.classList.remove("hidden");guideBtn.classList.add("hidden");
  const step=(n,h,b)=>`<div class="gstep"><div class="gn">${n}</div><div><b>${h}</b><div>${b}</div></div></div>`;
  app.innerHTML=`
  <div class="card"><h2>1 · Set up over the peg</h2>
    ${step(1,"Tripod","Legs spread over the peg, head roughly level, chest height. Press the legs firmly into the ground.")}
    ${step(2,"Centre","Look through the optical/laser plummet. Turn the <b>foot screws</b> until the dot is on the peg nail.")}
    ${step(3,"Rough level","Adjust <b>tripod leg lengths</b> to centre the circular bubble. The plummet dot stays on the peg.")}
    ${step(4,"Fine level","Two foot screws in opposite directions, rotate 90°, then the third screw. Use the plate bubble or the electronic level.")}
    ${step(5,"Recheck","Dot drifted? Loosen the centre screw, <b>slide</b> (don't rotate) the instrument on the head, re-level. Repeat until centred and level.")}
    ${step(6,"HI","Measure instrument height with tape and book it.")}
  </div>
  <div class="card"><h2>2 · Settings (once a day)</h2>
    <div class="row"><span>Angle direction</span><b>HR (turn right)</b></div>
    <div class="row"><span>Distance mode</span><b>HD, not SD</b></div>
    <div class="row"><span>Prism constant</span><b>match the prism</b></div>
    <div class="row"><span>Temp / pressure</span><b>enter if asked</b></div>
  </div>
  ${PK==="minor"?`<div class="card"><h2>Minor traverse: what it is for</h2>
    ${step("1","Purpose","Control for the <b>detailed topographic survey</b> of your sub-area. Detailing (Day 4–5) is done from these stations, so put them where the details are visible.")}
    ${step("2","Tie to the major","It starts and ends on major stations (or forms its own loop through one), so its coordinates come from the major traverse. Plotting of the minor must show inside the major.")}
    ${step("3","Pegs",`Mark minor pegs as <b>${pegNo()}m1, ${pegNo()}m2…</b> (camp group number, small m, number). Major pegs use capital M: ${pegNo()}M1.`)}
    ${step("4","Ratio","Longest leg : shortest leg ≤ <b>3 : 1</b>. Avoid very acute or very obtuse angles (keep away from 180° ± 20°).")}
  </div>`:""}
  <div class="card"><h2>3 · ${SETS===1?"One set only (guideline 8)":"One set (app order)"}</h2>
    ${step(1,"FL → BS","Telescope face left. Sight BS low on the pole. <b>0SET</b> → 0°00′00″"+(SETS===2?" (Set II: <b>HSET 90°00′00″</b>)":"")+". Measure HD to BS.")}
    ${step(2,"FL → FS","Turn <b>clockwise</b> to FS, read the angle. Measure <b>HD</b> to FS.")}
    ${step(3,"Change face","Plunge the telescope over the top and swing 180°. Now face right.")}
    ${step(4,"FR → FS","Sight FS again, read. Should be FL reading + 180°.")}
    ${step(5,"FR → BS","Sight BS, read. Should be ≈ 180°"+(SETS===2?" (Set II ≈ 270°).":"."))}
    <p class="note">${SETS===2?"Set I starts at 0°, Set II at 90°, so the two sets use different parts of the circle.":"Minor traverse needs only one set (face left + face right)."}</p>
  </div>
  <div class="card"><h2>4 · Limits (from the guidelines)</h2>
    <div class="row"><span>FR − FL, same target</span><b>180° ± 20″</b></div>
    <div class="row"><span>FL angle − FR angle (yellow note only)</span><b>± 20″</b></div>
    ${SETS===2?`<div class="row"><span>Set I mean vs Set II mean</span><b>≤ 1′</b></div>`:""}
    <div class="row"><span>FW vs BW distance (EDM)</span><b>≥ 1 : ${LIM.prec}</b></div>
    ${PK==="minor"?`<div class="row"><span>FW vs BW distance (tape)</span><b>≥ 1 : 1000</b></div>`:""}
    <div class="row"><span>e.g. 80 m leg</span><b>Δ ≤ ${Math.round(80000/LIM.prec)} mm</b></div>
    <div class="row"><span>Max : min leg</span><b>≤ ${LIM.ratio} : 1</b></div>
    <div class="row"><span>Angular closure, N = ${N}</span><b>±${LIM.angK===60?"1′":LIM.angK+"″"}√N = ±${Math.round(LIM.angK*Math.sqrt(N))}″</b></div>
    ${LINK?`<div class="row"><span>Closure check</span><b>bearing ${esc(AREF)}–${esc(ST[0])} → ${esc(ST[N-1])}–${esc(DREF)}</b></div>`:`<div class="row"><span>Interior sum, N = ${N}</span><b>${(2*N-4)*90}°</b></div>`}
    <div class="row"><span>Linear closure (evening, Gale table)</span><b>≥ 1 : ${LIM.prec}</b></div>
    <div class="row"><span>Plot scale (coordinate method)</span><b>1 : ${PK==="minor"?500:1000}</b></div>
  </div>
  <div class="card"><h2>5 · Before you pack up</h2>
    ${step("✓","Green banner","App shows “passed all checks”.")}
    ${step("✎","Reference sketch","Tie the peg to 2–3 permanent objects (wall corner, pole, tree) with tape distances. Booking format 1.")}
    ${step("⇩","Backup","Every few stations: Save backup on the home screen.")}
  </div>
  <div class="card"><h2>Team roles</h2>
    <div class="row"><span>Instrument</span><b>sights, reads aloud</b></div>
    <div class="row"><span>Booker</span><b>field book, ball pen, reads back</b></div>
    <div class="row"><span>App</span><b>types, calls pass / re-check</b></div>
    <div class="row"><span>2 × prism</span><b>BS and FS, bubble centred</b></div>
  </div>
  <div class="card"><h2>Common mistakes</h2>
    <ul class="glist">
      <li>Sighting the top of a tilted prism pole: aim low.</li>
      <li>Bumping the tripod between faces: recheck the bubble before Set II.</li>
      ${SETS===2?"<li>Not re-zeroing to 90° for Set II.</li>":""}
      <li>Booking SD instead of HD: check the display label.</li>
      <li>Wrong target: agree hand signals with prism holders (crowd tomorrow).</li>
      <li>Correcting data: strike once, write the new value above. Never overwrite.</li>
    </ul>
  </div>
  <div class="nav"><button class="btn pri" onclick="location.hash='${PROF.home}'">All stations</button></div>`;
}

function pegNo(){return esc(String(loadCfg("major").cfg.group||"").replace(/^0+/,""))}
function sysFont(){try{return localStorage.getItem("trav-font")==="system"}catch(e){return false}}
function applyFont(){document.body.classList.toggle("sysfont",sysFont())}
function setFont(sys){try{localStorage.setItem("trav-font",sys?"system":"app")}catch(e){}applyFont();route()}
/* accent colour themes: [light acc, light acc2, light hero stops], [dark acc, dark acc2, dark hero stops] */

function accKey(){try{const k=localStorage.getItem("trav-accent");return ACCENTS[k]?k:"teal"}catch(e){return "teal"}}
function applyAccent(){const A=ACCENTS[accKey()],dark=matchMedia("(prefers-color-scheme: dark)").matches,v=A[dark?2:1],r=document.documentElement.style;
  r.setProperty("--acc",v[0]);r.setProperty("--acc2",v[1]);r.setProperty("--hero",`linear-gradient(135deg,${v[2][0]} 0%,${v[2][1]} 55%,${v[2][2]} 100%)`);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=A[1][1]}

function setType(t){document.getElementById("cfgType").value=t;document.querySelectorAll("[data-type]").forEach(b=>b.classList.toggle("on",b.dataset.type===t));

function saveCfg(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():""},up=x=>x.toUpperCase().replace(/\s+/g,"");
  const type=g("cfgType")||"loop",m=+document.getElementById("cfgM").textContent;
  const c={group:document.getElementById("cfgGroup")?g("cfgGroup"):CFG.group,type,cps:g("cfgCps").split(/[,\s]+/).map(up).filter(Boolean),m,px:CFG.px,
    a:up(g("cfgA")),b:up(g("cfgB")),c:up(g("cfgC")),d:up(g("cfgD")),brgS:g("cfgBS"),brgE:g("cfgBE")};
  const mN=Array.from({length:m},(_,i)=>c.px+(i+1));
  if(type==="link"&&!(c.a&&c.b&&c.c&&c.d)){alert("A link traverse needs its start line (e.g. M14, M15) and end line (e.g. M17, M18).");return}
  const names=type==="link"?[c.b].concat(mN,[c.c]):c.cps.concat(mN);
  if(names.length<3){alert("A traverse needs at least 3 stations.");return}
  if(new Set(names).size!==names.length){alert("Station names must be unique.");return}
  const hidden=ST.filter(s=>!names.includes(s)&&D[s]&&(D[s].dBS||D[s].dFS||D[s].sets.some(x=>Object.keys(x).length)));
  if(hidden.length&&!confirm("These stations have readings and will be hidden (not deleted): "+hidden.join(", ")+"\nContinue?"))return;
  try{localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch(e){alert("Could not save setup.");return}
  location.hash=PROF.home;location.reload();
}

function cellOK(p,val){if(val==="")return true;if(!/^\d+$/.test(val))return false;const n=+val;return p===0?n<360:n<60}
function wire(){
  const ins=[...app.querySelectorAll("input")];
  ins.forEach((el,idx)=>{
    const next=()=>{const n=ins[idx+1];if(n){n.focus();n.select()}else el.blur()};
    if(el.parentElement.classList.contains("dms")){
      const p=+el.dataset.p,box=el.parentElement,si=+box.dataset.si,k=box.dataset.k;
      el.addEventListener("focus",()=>el.select());
      el.addEventListener("input",()=>{
        el.value=el.value.replace(/\D/g,"");
        const ok=cellOK(p,el.value);el.classList.toggle("err",!ok);
        const vals=[...box.querySelectorAll("input")].map(x=>x.value);
        D[cur].sets[si][k]=vals;save();updateStation();
        // jump when no further digit could keep it valid
        const v=el.value,max=p===0?359:59,len=p===0?3:2;
        if(ok&&v!==""&&(v.length>=len||(+v)*10>max))next();
      });
      el.addEventListener("keydown",e=>{
        if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}
        if(e.key==="Backspace"&&el.value===""&&idx>0&&p>0){e.preventDefault();ins[idx-1].focus()}
      });
      el.classList.toggle("err",!cellOK(p,el.value));
    }else if(el.dataset.dist){
      el.addEventListener("input",()=>{el.value=el.value.replace(/[^\d.]/g,"");el.classList.toggle("err",el.value!==""&&num(el.value)==null);D[cur][el.dataset.dist]=el.value;save();updateStation()});
      el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();next()}});
    }
  });
  const ta=app.querySelector("[data-note]");ta.addEventListener("input",()=>{D[cur].note=ta.value;save()});
}

    document.getElementById("o"+si+"fsL").classList.toggle("badobs",r.cFS!=null&&Math.abs(r.cFS)>LIM.face);
    document.getElementById("o"+si+"fsR").classList.toggle("badobs",r.cFS!=null&&Math.abs(r.cFS)>LIM.face)});
  const L=legs(),lb=legBefore(L,i),lf=legAfter(L,i);
  const legRow=l=>l?`<div class="row"><span>${l.from}–${l.to} (≥1:${LIM.prec})</span>${l.prec==null?pill("wait",l.fw==null&&l.bw==null?"—":"other end at "+(l.fw==null?l.from:l.to)):pill(l.prec>=LIM.prec?"ok":"bad",precTxt(l.prec)+" · Δ"+(l.disc*1000).toFixed(0)+"mm")}</div>`:"";
  document.getElementById("resD").innerHTML=legRow(lb)+legRow(lf)||`<p class="note">This distance belongs to the major traverse.</p>`;
  const sd=c.setDiff,status=is.length?"bad":c.status;
  document.getElementById("resF").innerHTML=
    (SETS===2?`<div class="row"><span>Set I vs Set II (≤ 60″)</span>${sd==null?pill("wait","—"):pill(sd<=LIM.sets?"ok":"bad",sd+'"')}</div>`:"")+
    `<div class="row"><span>Mean horizontal angle</span><span class="big">${fmt(c.final)}</span></div>`;
  document.getElementById("banner").innerHTML=is.length?`<div class="alarm"><h4>⚠ Re-check before leaving ${s}</h4><ul>${is.map(x=>`<li>${x}</li>`).join("")}</ul></div>`
    :status==="ok"?`<div class="passbar">✓ ${s} passed all checks · move on</div>`:"";
  if(lastStatus!==null&&status!==lastStatus){if(status==="bad")toast("⚠ Check failed at "+s,true);else if(status==="ok")toast("✓ "+s+" complete")}
  lastStatus=status;
}

/* ===== Backup / merge / export ===== */
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
function blobFile(text,name,type){return new File([text],name,{type})}
function download(f){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function allTrav(fn){const prev=PK||"major",out={};for(const k of["major","minor"]){useTrav(k,true);out[k]=fn(k)}useTrav(prev,true);return out}
function backupFile(){const t=allTrav(k=>({config:loadCfg(k).configured?loadCfg(k).cfg:null,data:D}));
  return blobFile(JSON.stringify({app:"trav-major-v1",saved:new Date().toISOString(),config:t.major.config,data:t.major.data,minor:t.minor,...(()=>{const a=allLev(()=>LEV);return{lev:a.lev,fly:a.fly,mlev:a.mlev,bfly:a.bfly,bloop:a.bloop}})(),ct:CT,br:BR},null,1),`survey-camp-backup-${stamp()}.json`,"application/json")}
function backup(){download(backupFile())}
async function shareBackup(){const f=backupFile();
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:f.name})}catch(e){}}else{download(f);alert("Sharing not supported here; file saved to Downloads instead.")}}
function mergeTrav(src,tag){let n=0;const clash=[];if(!src)return[0,clash];
  for(const s of ST){if(!src[s])continue;const a=D[s],b=src[s];
    for(const si of[0,1])for(const[k]of OBS){const bv=b.sets&&b.sets[si]&&b.sets[si][k];if(!bv||dec(bv)==null)continue;
      if(dec(a.sets[si][k])==null){a.sets[si][k]=bv;n++}else if(dec(a.sets[si][k])!==dec(bv))clash.push(tag+s+" set"+(si+1)+" "+k)}
    for(const k of["dBS","dFS"]){if(num(b[k])==null)continue;if(num(a[k])==null){a[k]=b[k];n++}else if(num(a[k])!==num(b[k]))clash.push(tag+s+" "+k)}
    if(b.note&&!a.note)a.note=b.note}
  save();return[n,clash]}
document.getElementById("fileIn").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text()),prev=PK||"major";let n=0,clash=[];
    useTrav("major",true);let r=mergeTrav(j.data||j,"");n+=r[0];clash=clash.concat(r[1]);
    if(j.minor){if(j.minor.config&&!loadCfg("minor").configured)localStorage.setItem(PROFILES.minor.cfgKey,JSON.stringify(j.minor.config));
      useTrav("minor",true);r=mergeTrav(j.minor.data,"minor ");n+=r[0];clash=clash.concat(r[1])}
    useTrav(prev,true);{const r=allLev(k=>levMerge(j[k]));n+=r.lev+r.fly+r.mlev+r.bfly+r.bloop;n+=ctMerge(j.ct);n+=brMerge(j.br)}route();
    alert(`Merged ${n} values.`+(clash.length?`\nDifferent from this phone (kept this phone's): ${clash.join(", ")}`:""));
  }catch(err){alert("Not a valid backup file.")}
});
function clearTrav(){if(prompt(`Type DELETE to clear all ${PROF.name.toLowerCase()} readings on this phone. A backup file is saved first.`)==="DELETE"){backup();D=blank();save();route()}}
function wipe(){if(prompt('Type DELETE to clear ALL jobs on this phone (traverses and levelling). A backup file is saved first.')==="DELETE"){backup();allTrav(()=>{D=blank();save()});PEG=pegBlank();allLev(()=>{LEV={lines:[],peg:PEG};levSave()});CT={known:{},setups:[]};ctSave();BR=brBlank();brSave();route()}}
function travCSV(csv){
  const two=SETS===2,h=[["Inst St","Sighted To","Face","SetI D","SetI M","SetI S"].concat(two?["SetII D","SetII M","SetII S"]:[])];
  ST.forEach((s,i)=>{const st=D[s];OBS.forEach(([k,face,t],j)=>{const a=st.sets[0][k]||["","",""],b=st.sets[1][k]||["","",""];
    h.push([j===0?s:"",t==="BS"?bsOf(i):fsOf(i),face==="FL"?"L":"R",a[0],a[1],a[2]].concat(two?[b[0],b[1],b[2]]:[]))})});
  const d=[["S.No.","From","To","Forward (FW)","Backward (BW)"]];
  legs().forEach((l,i)=>d.push([i+1,l.from,l.to,l.fw??"",l.bw??""]));
  return `${PROF.name.toUpperCase()}: HORIZONTAL ANGLES (paste D M S into template columns E:G${two?" and J:L":""})\n`+h.map(csv).join("\n")+
    `\n\n${PROF.name.toUpperCase()}: LINEAR DISTANCE (paste FW BW into template columns E:F)\n`+d.map(csv).join("\n")+"\n"}
function exportCSV(){
  const csv=r=>r.map(v=>v==null?"":/[",\n]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(",");
  const t=allTrav(k=>PROF.configured&&PROF.ready?travCSV(csv):"");
  download(blobFile(t.major+(t.minor?"\n\n"+t.minor:"")+(a=>a.fly+a.lev+a.mlev+a.bfly+a.bloop)(allLev(k=>levCSV(csv)?"\n\n"+LP.name.toUpperCase()+levCSV(csv):""))+ctCSV(csv)+brCSV(csv),`survey-camp-excel-${stamp()}.csv`,"text/csv"));
}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");
applyFont();applyAccent();route();
</script>
